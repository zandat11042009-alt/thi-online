<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Làm bài</title>
<style>
body {
  font-family: Arial;
  background: #f4f6fb;
}
.container {
  background: white;
  margin: 50px auto;
  padding: 20px;
  width: 400px;
  border-radius: 10px;
}
button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">
  <h3>Câu 1: 2 + 2 = ?</h3>

  <input type="radio" name="q1" value="3"> 3<br>
  <input type="radio" name="q1" value="4"> 4<br>
  <input type="radio" name="q1" value="5"> 5<br>

  <button onclick="submitQuiz()">Nộp bài</button>
</div>

<script>
function submitQuiz() {
  const answer = document.querySelector('input[name="q1"]:checked');

  if(!answer) {
    alert("Chọn đáp án!");
    return;
  }

  if(answer.value === "4") {
    alert("Đúng!");
  } else {
    alert("Sai!");
  }
}
</script>

</body>
</html>
