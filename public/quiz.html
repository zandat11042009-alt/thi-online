<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Làm bài</title>
<style>
body { background:#0f172a; color:white; font-family:Arial; text-align:center; }
.box { background:#1e293b; padding:15px; margin:15px; border-radius:10px; }
</style>
</head>

<body>

<h2>Làm bài thi</h2>

<div id="quiz"></div>

<button onclick="submit()">Nộp bài</button>

<script>
let questions = [];
let answers = [];

async function load() {
  const res = await fetch("/api/questions");
  questions = await res.json();

  let html = "";

  questions.forEach((q, i) => {
    html += `<div class="box">
      <h3>${i+1}. ${q.question}</h3>`;

    ["A","B","C","D"].forEach(k => {
      if(q[k]){
        html += `
        <label>
          <input type="radio" name="q${i}" value="${k}" 
          onchange="answers[${i}]='${k}'">
          ${q[k]}
        </label><br>`;
      }
    });

    html += "</div>";
  });

  document.getElementById("quiz").innerHTML = html;
}

async function submit() {
  let score = 0;

  questions.forEach((q, i) => {
    if (answers[i] == q.correct) score++;
  });

  alert("Điểm: " + score + "/" + questions.length);
}

load();
</script>

</body>
</html>
