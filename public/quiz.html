<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Làm bài</title>

<style>
body { background:#0f172a; color:white; font-family:Arial; }
.box { width:500px; margin:30px auto; }
button { margin:5px; padding:10px; width:100%; }
.submit { background:#22c55e; }
</style>
</head>

<body>

<div class="box">
<h2>Làm bài</h2>
<div id="quiz"></div>
<button class="submit" onclick="submit()">Nộp bài</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem("questions")) || [];
let html = "";

data.forEach((q, i) => {
    html += `
    <div>
        <p>${i+1}. ${q.question}</p>
        <label><input type="radio" name="q${i}" value="a"> ${q.a}</label><br>
        <label><input type="radio" name="q${i}" value="b"> ${q.b}</label><br>
        <label><input type="radio" name="q${i}" value="c"> ${q.c}</label><br>
        <label><input type="radio" name="q${i}" value="d"> ${q.d}</label><br>
    </div>
    `;
});

document.getElementById("quiz").innerHTML = html;

function submit() {
    let score = 0;

    data.forEach((q, i) => {
        let ans = document.querySelector(`input[name=q${i}]:checked`);
        if (ans && ans.value === q.correct) score++;
    });

    alert("Bạn đúng " + score + "/" + data.length);
}
</script>

</body>
</html>
