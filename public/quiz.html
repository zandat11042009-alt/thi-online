<div id="quiz"></div>

<script>
let data = JSON.parse(localStorage.getItem("questions")) || [];

let html = "";

data.forEach((q, i) => {
    html += `
        <div>
            <p>${i+1}. ${q.question}</p>
            <button>${q.a}</button><br>
            <button>${q.b}</button><br>
            <button>${q.c}</button><br>
            <button>${q.d}</button><br>
        </div>
    `;
});

document.getElementById("quiz").innerHTML = html;
</script>
