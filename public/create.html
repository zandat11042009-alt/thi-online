<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo đề</title>

<style>
body { background:#0f172a; color:white; text-align:center; }
.box { background:#1e293b; padding:20px; margin:50px auto; width:350px; border-radius:10px; }
input { width:100%; padding:10px; margin:8px 0; border:none; border-radius:5px; }
button { width:100%; padding:10px; background:#3b82f6; border:none; color:white; border-radius:5px; }
</style>
</head>

<body>

<div class="box">
<h2>Tạo câu hỏi</h2>

<input id="q" placeholder="Câu hỏi">
<input id="a" placeholder="A">
<input id="b" placeholder="B">
<input id="c" placeholder="C">
<input id="d" placeholder="D">
<input id="correct" placeholder="Đáp án đúng (a/b/c/d)">

<button onclick="add()">Thêm</button>
</div>

<script>
function add() {
    let data = JSON.parse(localStorage.getItem("questions")) || [];

    data.push({
        question: q.value,
        a: a.value,
        b: b.value,
        c: c.value,
        d: d.value,
        correct: correct.value
    });

    localStorage.setItem("questions", JSON.stringify(data));

    alert("Đã thêm!");
}
</script>

</body>
</html>
