<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo đề</title>
<style>
body { background:#0f172a; color:white; text-align:center; }
.box { background:#1e293b; padding:20px; width:300px; margin:100px auto; border-radius:10px; }
input, select {
  width:100%; padding:10px; margin:5px 0;
  border:none; border-radius:5px;
}
button {
  width:100%; padding:10px;
  background:#3b82f6; color:white;
  border:none; border-radius:5px;
}
</style>
</head>
<body>

<div class="box">
<h2>Thêm câu hỏi</h2>

<input id="question" placeholder="Câu hỏi">

<input id="a" placeholder="Đáp án A">
<input id="b" placeholder="Đáp án B">
<input id="c" placeholder="Đáp án C">
<input id="d" placeholder="Đáp án D">

<select id="type">
  <option value="single">Trắc nghiệm</option>
  <option value="truefalse">Đúng / Sai</option>
  <option value="short">Trả lời ngắn</option>
</select>

<input id="correct" placeholder="Đáp án đúng">

<button onclick="add()">Thêm</button>

</div>

<script>
function add() {
  const data = {
    question: document.getElementById("question").value,
    a: document.getElementById("a").value,
    b: document.getElementById("b").value,
    c: document.getElementById("c").value,
    d: document.getElementById("d").value,
    type: document.getElementById("type").value,
    correct: document.getElementById("correct").value
  };

  fetch("/api/questions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => alert("Đã thêm!"));
}
</script>

</body>
</html>
