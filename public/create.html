<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo đề</title>

<style>
body { background:#0f172a; color:white; font-family:Arial; text-align:center; }
.box { background:#1e293b; padding:20px; margin:50px auto; width:350px; border-radius:10px; }
input, select {
  width:100%; padding:10px; margin:5px 0;
  border:none; border-radius:5px;
}
button {
  width:100%; padding:10px;
  background:#3b82f6; color:white;
  border:none; border-radius:5px;
}
</style>
</head>

<body>

<div class="box">
<h2>Tạo câu hỏi</h2>

<input id="q" placeholder="Câu hỏi">
<input id="a" placeholder="A">
<input id="b" placeholder="B">
<input id="c" placeholder="C">
<input id="d" placeholder="D">

<select id="correct">
  <option value="A">Đáp án A</option>
  <option value="B">Đáp án B</option>
  <option value="C">Đáp án C</option>
  <option value="D">Đáp án D</option>
</select>

<button onclick="save()">Lưu câu hỏi</button>

<hr>

<h3>Upload file (.txt)</h3>
<input type="file" id="file">
<button onclick="upload()">Upload</button>

</div>

<script>
// lưu thủ công
async function save() {
  const data = {
    question: q.value,
    A: a.value,
    B: b.value,
    C: c.value,
    D: d.value,
    correct: correct.value
  };

  await fetch("/api/questions", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });

  alert("Đã lưu!");
}

// upload file txt
function upload() {
  const file = document.getElementById("file").files[0];
  if(!file) return alert("Chọn file");

  const reader = new FileReader();

  reader.onload = async function(e) {
    const text = e.target.result;

    const blocks = text.split("\n\n");

    for (let block of blocks) {
      const lines = block.split("\n");

      if(lines.length < 5) continue;

      let obj = {
        question: lines[0],
        A: lines[1],
        B: lines[2],
        C: lines[3],
        D: lines[4],
        correct: ""
      };

      if (lines[1].includes("*")) obj.correct = "A";
      if (lines[2].includes("*")) obj.correct = "B";
      if (lines[3].includes("*")) obj.correct = "C";
      if (lines[4].includes("*")) obj.correct = "D";

      await fetch("/api/questions", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(obj)
      });
    }

    alert("Upload xong!");
  };

  reader.readAsText(file);
}
</script>

</body>
</html>
