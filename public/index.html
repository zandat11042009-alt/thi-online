<div id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem("questions")) || [];

let html = "";

data.forEach((q, i) => {
    html += `
        <div style="background:#1e293b; padding:10px; margin:10px; border-radius:8px;">
            <b>Câu ${i+1}:</b> ${q.question}
        </div>
    `;
});

document.getElementById("list").innerHTML = html || "Chưa có đề nào";
</script>
