<h2>Đăng nhập Admin</h2>

<input id="user" placeholder="user"><br><br>
<input id="pass" type="password" placeholder="pass"><br><br>

<button onclick="login()">Đăng nhập</button>

<script>
function login() {
    let u = user.value;
    let p = pass.value;

    if (u === "admin" && p === "123456") {
        window.location.href = "create.html"; // 🔥 chuyển trang
    } else {
        alert("Sai tài khoản");
    }
}
</script>
