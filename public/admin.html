<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body { background:#0f172a; color:white; text-align:center; }
.box { background:#1e293b; padding:20px; margin:100px auto; width:300px; border-radius:10px; }
input { width:100%; padding:10px; margin:10px 0; border:none; border-radius:5px; }
button { width:100%; padding:10px; background:#3b82f6; color:white; border:none; border-radius:5px; }
</style>
</head>

<body>

<div class="box">
    <h2>Admin</h2>
    <input id="user" placeholder="Tài khoản">
    <input id="pass" type="password" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập</button>
</div>

<script>
function login() {
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if (u === "admin" && p === "123456") {
        location.href = "create.html";
    } else {
        alert("Sai tài khoản!");
    }
}
</script>

</body>
</html>
