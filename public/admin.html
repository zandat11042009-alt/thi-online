<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body {
  font-family: Arial;
  background: #f4f6fb;
  text-align: center;
}

.box {
  background: white;
  margin: 100px auto;
  padding: 20px;
  width: 300px;
  border-radius: 10px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px;
}

button {
  padding: 10px;
  width: 100%;
  background: #0f172a;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Đăng nhập Admin</h2>

  <input type="text" id="user" placeholder="Tài khoản">
  <input type="password" id="pass" placeholder="Mật khẩu">

  <button onclick="login()">Đăng nhập</button>
</div>

<script>
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  if (user === "admin" && pass === "123456") {
    alert("Đăng nhập thành công!");

    // 👉 QUAN TRỌNG: chuyển trang
    window.location.href = "quiz.html";

  } else {
    alert("Sai tài khoản hoặc mật khẩu!");
  }
}
</script>

</body>
</html>
